[platformio]
default_envs = seeed_xiao_esp32s3, esp32dev, esp32-s3-devkitc-1

; ==========================================================
; Shared Global Settings (Applies to all boards)
; ==========================================================
[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
build_flags =
    -D CORE_DEBUG_LEVEL=4               ; Enable log_d() calls
    -D CONFIG_NIMBLE_CPP_LOG_LEVEL=2    ; Set NimBLE log level to Warn
lib_deps =
    h2zero/NimBLE-Arduino @ ^1.4.1
    mathieucarbou/ESPAsyncWebServer @ ^3.3.23

; ==========================================================
; 1. Seeed XIAO ESP32-S3 (The Primary Dev Board)
; ==========================================================
[env:seeed_xiao_esp32s3]
board = seeed_xiao_esp32s3
build_flags =
    ${env.build_flags}
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D BOOT_BUTTON_PIN=0
    -D STATUS_LED_PIN=21
    -D LED_ACTIVE_LOW=true

; ==========================================================
; 2. Generic ESP32 (Classic WROOM-32, NodeMCU-32S, etc)
; Extremely common. Hardware UART.
; ==========================================================
[env:esp32dev]
board = esp32dev
build_flags =
    ${env.build_flags}
    -D BOOT_BUTTON_PIN=0
    -D STATUS_LED_PIN=2
    -D LED_ACTIVE_LOW=false

; ==========================================================
; 3. Generic ESP32-S3 DevKitC
; Standard S3 dev board. Dual USB ports.
; ==========================================================
[env:esp32-s3-devkitc-1]
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D BOOT_BUTTON_PIN=0
    ; Many generic S3 devkits don't have a standard single-color user LED.
    ; Pin 2 is commonly used if one exists.
    -D STATUS_LED_PIN=2
    -D LED_ACTIVE_LOW=false
