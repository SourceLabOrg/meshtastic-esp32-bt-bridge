[platformio]
default_envs = seeed_xiao_esp32s3, esp32dev, esp32-s3-devkitc-1

; ==========================================================
; Shared Global Settings (Applies to all boards)
; ==========================================================
[env]
platform = espressif32 @ 6.13.0
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
board_build.embed_files = data/cert/x509_crt_bundle.bin
build_flags =
    -D CORE_DEBUG_LEVEL=3                   ; Set Arduino global max level to Info to silence WiFi noise.
    -D CONFIG_NIMBLE_CPP_LOG_LEVEL=2        ; Set NimBLE log level to Warn or above.
    -D CONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED=1  ; Bridge only acts as BLE Central/Observer; strip Server role (~16KB Flash).
    -D CONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED=1 ; Bridge never advertises over BLE; strip Broadcaster role (~5KB Flash).
    -D CONFIG_BT_NIMBLE_MSYS1_BLOCK_COUNT=24        ; Double msys_1 255B blocks (12 -> 24) for 512B MTU duplex bursts.
    -D CONFIG_NIMBLE_CPP_ATT_VALUE_INIT_LENGTH=512  ; Fixed 512B NimBLEAttValue capacity to prevent variable-size realloc fragmentation.
extra_scripts = pre:generate_protos.py      ; For compiling meshtastic protocol buffers.
lib_deps =
    h2zero/NimBLE-Arduino @ 2.5.2               ; Used for Bluetooth Communication.
    ESP32Async/AsyncTCP @ 3.6.1                 ; Used for TCP bridge (port 4403) and WebUI transport.
    ESP32Async/ESPAsyncWebServer @ 3.12.1       ; Used for WebUI service.
    nanopb/Nanopb @ 0.4.93                      ; Used for protobuf parsing.

; ==========================================================
; 1. Seeed XIAO ESP32-S3 (The Primary Dev Board)
; ==========================================================
[env:seeed_xiao_esp32s3]
board = seeed_xiao_esp32s3
build_flags =
    ${env.build_flags}
    -D HARDWARE_BOARD_NAME=\"seeed_xiao_esp32s3\"
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D BOOT_BUTTON_PIN=0
    -D STATUS_LED_PIN=21
    -D LED_ACTIVE_LOW=true

; ==========================================================
; 2. Generic ESP32 (Classic WROOM-32, NodeMCU-32S, etc)
; Extremely common. Hardware UART.
; ==========================================================
[env:esp32dev]
board = esp32dev
build_flags =
    ${env.build_flags}
    -D HARDWARE_BOARD_NAME=\"esp32dev\"
    -D BOOT_BUTTON_PIN=0
    -D STATUS_LED_PIN=2
    -D LED_ACTIVE_LOW=false

; ==========================================================
; 3. Generic ESP32-S3 DevKitC
; Standard S3 dev board. Dual USB ports.
; ==========================================================
[env:esp32-s3-devkitc-1]
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -D HARDWARE_BOARD_NAME=\"esp32-s3-devkitc-1\"
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D BOOT_BUTTON_PIN=0
    ; Many generic S3 devkits don't have a standard single-color user LED.
    ; Pin 2 is commonly used if one exists.
    -D STATUS_LED_PIN=2
    -D LED_ACTIVE_LOW=false
