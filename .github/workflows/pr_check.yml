name: Build Check

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: PlatformIO Build Check
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Build Dependencies & Toolchains
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
            .pio
          key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini', 'generate_protos.py', 'proto/meshtastic/meshtastic/*.proto') }}
          restore-keys: |
            ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}
            ${{ runner.os }}-pio-

      - name: Install PlatformIO Core & Dependencies
        run: pip install -U platformio protobuf grpcio-tools

      - name: Build all firmware profiles
        run: pio run
