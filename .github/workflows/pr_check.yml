name: Build Check

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: PlatformIO Build Check
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check License Headers
        run: |
          missing=0
          while IFS= read -r f; do
            if ! head -n 5 "$f" | grep -Fxq "// Copyright (c) 2026 SourceLab.org (https://github.com/SourceLabOrg/meshtastic-esp32-bt-bridge)" || \
               ! head -n 5 "$f" | grep -Fxq "// SPDX-License-Identifier: MIT"; then
              echo "::error file=$f::Missing required license header in $f"
              missing=1
            fi
          done < <(find src include -type f \( -name "*.cpp" -o -name "*.c" -o -name "*.h" -o -name "*.hpp" \) | sort)
          exit $missing

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Build Dependencies & Toolchains
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
            .pio
          key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini', 'generate_protos.py', 'proto/meshtastic/meshtastic/*.proto') }}
          restore-keys: |
            ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}
            ${{ runner.os }}-pio-

      - name: Install PlatformIO Core & Dependencies
        run: pip install -U platformio protobuf grpcio-tools

      - name: Build all firmware profiles
        run: pio run
