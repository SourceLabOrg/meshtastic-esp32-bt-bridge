name: Deploy Web Flasher to GitHub Pages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Web Directory
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fetch the latest release tag
          LATEST_TAG=$(gh release list --limit 1 | awk '{print $1}')
          if [ -z "$LATEST_TAG" ]; then
            echo "No releases found. Exiting."
            exit 1
          fi
          echo "Latest release is $LATEST_TAG. Downloading binaries..."
          
          # Inject the version string into the HTML
          sed -i "s/id=\"version-display\">.*</id=\"version-display\">Firmware Version: ${LATEST_TAG}</g" web/index.html
          
          # Add a cache-buster to the manifest URLs to prevent browser caching issues
          # We use GITHUB_RUN_ID so even manual re-runs on the same tag bypass the cache
          sed -i "s/\.json/\.json?v=${GITHUB_RUN_ID}/g" web/index.html
          
          # Download all zip assets from the latest release
          gh release download "$LATEST_TAG" -D web/firmware --pattern "*.zip"
          
          cd web/firmware
          # Extract and generate manifest for each board
          for zip in *.zip; do
            # Extract board name from filename (e.g. firmware-esp32dev-v1.0.0.zip -> esp32dev)
            board=$(echo "$zip" | sed -E 's/firmware-(.+)-v[0-9].+/\1/')
            
            mkdir -p "$board"
            unzip "$zip" -d "$board"
            rm "$zip"
            
            # Determine bootloader offset and chip family based on architecture
            if [[ "$board" == *"s3"* ]]; then
              bootloader_offset="0"
              chip_family="ESP32-S3"
            else
              bootloader_offset="4096"
              chip_family="ESP32"
            fi
            
            # 1. Generate the FULL Factory manifest (wipes device)
            cat <<EOF > "../manifest_${board}.json"
          {
            "name": "Meshtastic Bridge ($board)",
            "version": "$LATEST_TAG",
            "builds": [
              {
                "chipFamily": "$chip_family",
                "parts": [
                  { "path": "firmware/$board/bootloader.bin", "offset": $bootloader_offset },
                  { "path": "firmware/$board/partitions.bin", "offset": 32768 },
                  { "path": "firmware/$board/boot_app0.bin", "offset": 57344 },
                  { "path": "firmware/$board/firmware.bin", "offset": 65536 }
                ]
              }
            ]
          }
          EOF
          
            # 2. Generate the UPDATE manifest (preserves settings by allowing user to uncheck erase)
            cat <<EOF > "../manifest_${board}_update.json"
          {
            "name": "Meshtastic Bridge ($board)",
            "version": "$LATEST_TAG",
            "new_install_prompt_erase": true,
            "builds": [
              {
                "chipFamily": "$chip_family",
                "parts": [
                  { "path": "firmware/$board/bootloader.bin", "offset": $bootloader_offset },
                  { "path": "firmware/$board/partitions.bin", "offset": 32768 },
                  { "path": "firmware/$board/boot_app0.bin", "offset": 57344 },
                  { "path": "firmware/$board/firmware.bin", "offset": 65536 }
                ]
              }
            ]
          }
          EOF
          done
          cd ../../

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './web'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
